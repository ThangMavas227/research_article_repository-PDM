spring.application.name=research-repo-api

# Database connection. Defaults suit a local MySQL; override with environment variables
# (DB_URL, DB_USER, DB_PASSWORD) so no password is stored in the repository.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/research_repo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
