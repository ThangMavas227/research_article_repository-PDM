<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Articles | Research Article Repository</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="readerSavedSearches.css">

    <script src="config.js"></script>
    <script src="navigation.js" defer></script>
</head>

<body>
<header>
    <h1>Research Article Repository</h1>
    <nav aria-label="Main navigation" data-app-navigation></nav>
</header>
<div data-navigation-notice hidden role="status" aria-live="polite"></div>

<main>
    <section id="browse">
        <div class="browse-hero">
            <span class="eyebrow-label">Academic Archive</span>
            <h2>Browse Research Articles</h2>
            <p class="browse-subtitle">Discover indexed scholarly publications, inspect citation networks, and filter records by keyword or publication year.</p>
        </div>

        <!-- Search Form -->
        <form id="browse-filter-form" role="search">
            <div class="search-field-group keyword-group">
                <label for="keyword">Search articles</label>
                <input
                        type="search"
                        id="keyword"
                        name="keyword"
                        placeholder="Title, topic, or author name..."
                >
            </div>

            <div class="search-field-group year-group">
                <label for="year">Publication Year</label>
                <input
                        type="number"
                        id="year"
                        name="year"
                        min="1"
                        max="9999"
                        step="1"
                        placeholder="e.g. 2025"
                >
            </div>

            <div class="search-actions">
                <button type="submit">Search</button>
                <button type="button" id="clear-filters" class="secondary-btn">Clear</button>
                <button type="button" id="open-save-search" class="secondary-btn" hidden>Save this search</button>
            </div>
        </form>

        <!-- Reader-only action: save filters applied on the Browse page -->
        <section id="save-search-panel" class="save-search-panel" aria-labelledby="save-search-title" hidden>
            <h3 id="save-search-title">Save this search</h3>
            <p id="save-search-summary">Your current filters will be saved to your Reader account.</p>
            <form id="save-search-form" class="save-search-inline-form">
                <label for="save-search-name">
                    Search name
                    <input id="save-search-name" name="searchName" type="text"
                           maxlength="100" required placeholder="e.g. Papers about indexing" autocomplete="off">
                </label>
                <button type="submit" id="confirm-save-search">Save search</button>
                <button type="button" id="cancel-save-search" class="secondary-btn">Cancel</button>
            </form>
            <p id="save-search-message" class="saved-search-feedback" role="status" aria-live="polite" hidden></p>
        </section>

        <!-- Article Results -->
        <section aria-labelledby="results-title">
            <div class="results-header">
                <div class="results-title-group">
                    <h3 id="results-title">Publications</h3>
                    <p id="count-pill"></p>
                </div>
                <p id="page-label"></p>
            </div>

            <!-- Loading / Empty / Error -->
            <div id="status-region" role="status" aria-live="polite"></div>

            <!-- Article list -->
            <div id="article-list"></div>

            <!-- Pagination -->
            <div id="pagination" hidden>
                <button type="button" id="prev-btn">← Previous</button>
                <span id="page-info"></span>
                <button type="button" id="next-btn">Next →</button>
            </div>
        </section>
    </section>
</main>

<script src="savedSearchApi.js"></script>
<script src="browse.js"></script>
</body>
</html>
