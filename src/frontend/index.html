
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Research Article Repository</title>
    <link rel="stylesheet" href="style.css">
    <!-- Shared API URL and default Mock/API mode. -->
    <script src="config.js"></script>
</head>

<body>
<header>
    <h1>Research Article Repository</h1>
    <nav aria-label="Main navigation">
        <a href="#browse">Browse Articles</a>
    </nav>
</header>

<main>
    <section id="browse">
        <h2>Browse Research Articles</h2>
        <p>Explore academic research articles.</p>

        <!-- Search Form -->
        <form id="browse-filter-form" role="search">
            <label for="keyword">
                Search articles
            </label>

            <input
                    type="search"
                    id="keyword"
                    name="keyword"
                    placeholder="Search by title or author"
            >

            <label for="year">Year</label>
            <input
                    type="number"
                    id="year"
                    name="year"
                    min="1"
                    max="9999"
                    step="1"
                    placeholder="Any year"
            >

            <button type="submit">Search</button>
            <button type="button" id="clear-filters" class="secondary-btn">Clear</button>
        </form>

        <!-- Starts in Mock mode while USE_API=false; switch manually for integration tests. -->
        <div class="data-controls">
            <label for="data-mode">Data source:</label>
            <select id="data-mode">
                <option value="api">Backend API</option>
                <option value="mock">Mock demo</option>
            </select>
            <label for="mock-scenario" id="mock-scenario-label" hidden>
                Mock state:
                <select id="mock-scenario">
                    <option value="normal">Normal</option>
                    <option value="empty">Empty</option>
                    <option value="error">Error</option>
                </select>
            </label>
        </div>

        <!-- Article Results -->
        <section aria-labelledby="results-title">
            <h3 id="results-title">Articles</h3>

            <p id="count-pill"></p>
            <p id="page-label"></p>

            <!-- Loading / Empty / Error -->
            <div id="status-region"
                role="status"
                aria-live="polite"></div>

            <!-- Article list -->
            <div id="article-list"></div>

            <!-- Pagination -->
            <div id="pagination" hidden>
                <button type="button" id="prev-btn">Previous</button>

                <span id="page-info"></span>

                <button type="button" id="next-btn">Next</button>
            </div>
        </section>
    </section>
</main>

<script src="search.js"></script>
<script src="mockData.js"></script>
<script src="browse.js"></script>
</body>
</html>
